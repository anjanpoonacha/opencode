name: Sync Upstream

on:
  schedule:
    - cron: "0 0 * * 0" # Sunday 00:00 UTC
    - cron: "0 0 * * 3" # Wednesday 00:00 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FEATURE_BRANCH: feature-commits
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/sst/opencode.git || true
          git fetch upstream --tags

      - name: Get upstream version
        id: upstream
        run: |
          VERSION=$(npm view opencode-ai version)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Upstream version: $VERSION"

      - name: Check if already synced
        id: check
        run: |
          VERSION="${{ steps.upstream.outputs.version }}"
          if git rev-parse "v${VERSION}-anjan" >/dev/null 2>&1; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Already synced to v${VERSION}-anjan"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Need to sync to v${VERSION}"
          fi

      - name: Sync with upstream
        if: steps.check.outputs.skip != 'true'
        id: sync
        run: |
          VERSION="${{ steps.upstream.outputs.version }}"
          BRANCH="sync/v${VERSION}"

          # Start from feature-commits (always matches release — no stale base)
          git checkout "origin/${FEATURE_BRANCH}"
          git checkout -b "$BRANCH"

          # Find the previous upstream version from the last sync commit on this branch
          PREV_VERSION=$(git log --format="%s" | grep "^sync: upstream v" | head -1 | sed 's/sync: upstream v//')
          echo "Previous upstream: v${PREV_VERSION}"
          echo "New upstream: v${VERSION}"

          FAILED="false"

          if [ -n "$PREV_VERSION" ] && git rev-parse "v${PREV_VERSION}" >/dev/null 2>&1; then
            # Apply only the delta between previous and new upstream (minimal conflicts)
            echo "Applying delta: v${PREV_VERSION} -> v${VERSION}"
            git diff "v${PREV_VERSION}" "v${VERSION}" | git apply --3way

            if [ $? -ne 0 ]; then
              echo "Delta apply failed — falling back to conflict list"
              CONFLICTS=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
              echo "Conflicting files: $CONFLICTS"
              FAILED="true"
              git apply --abort 2>/dev/null || git reset --hard HEAD
            else
              git add -A
              git diff --cached --quiet || git commit -m "sync: upstream v${VERSION}" --no-verify
            fi
          else
            echo "No previous sync found — applying full upstream"
            git merge --squash "v${VERSION}" -X theirs --no-commit
            git add -A
            git diff --cached --quiet || git commit -m "sync: upstream v${VERSION}" --no-verify
          fi

          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Preserve fork workflows
        if: steps.check.outputs.skip != 'true'
        run: |
          # Ensure fork-infrastructure files always match release (not upstream)
          git checkout origin/release -- .github/workflows/ scripts/publish-fork.ts
          git add .github/workflows/ scripts/publish-fork.ts
          git diff --cached --quiet || git commit -m "preserve fork workflow files" --no-verify

      - name: Push sync branch
        if: steps.check.outputs.skip != 'true'
        run: |
          git push origin "${{ steps.sync.outputs.branch }}" --force

      - name: Create PR
        if: steps.check.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          SYNC_VERSION: ${{ steps.upstream.outputs.version }}
          SYNC_BRANCH: ${{ steps.sync.outputs.branch }}
          SYNC_FAILED: ${{ steps.sync.outputs.failed }}
          FEATURE_BRANCH: ${{ env.FEATURE_BRANCH }}
        with:
          script: |
            const version = process.env.SYNC_VERSION;
            const branch = process.env.SYNC_BRANCH;
            const failed = process.env.SYNC_FAILED === 'true';

            let body = `## Sync with upstream v${version}\n\n`;

            if (failed) {
              body += `### ⚠️ Conflicts Detected\n\n`;
              body += `The upstream delta could not be applied cleanly.\n\n`;
              body += `**To fix:**\n`;
              body += `\`\`\`bash\n`;
              body += `git fetch origin ${branch}\n`;
              body += `git checkout ${branch}\n`;
              body += `# Resolve conflicts, then:\n`;
              body += `git add -A && git commit -m "sync: upstream v${version}"\n`;
              body += `git push origin ${branch} --force\n`;
              body += `\`\`\`\n`;
            } else {
              body += `### ✅ Clean sync — ready to merge.\n\n`;
              body += `Applied upstream delta from previous version to v${version}.\n`;
              body += `All fork customizations preserved from \`feature-commits\`.\n`;
            }

            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: 'open'
            });

            if (prs.length > 0) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prs[0].number,
                body: body
              });
              console.log(`Updated PR #${prs[0].number}`);
            } else {
              const { data: pr } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `sync: upstream v${version}`,
                head: branch,
                base: 'release',
                body: body
              });
              console.log(`Created PR #${pr.number}`);

              if (!failed) {
                await github.rest.pulls.merge({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  merge_method: 'rebase'
                });
                console.log(`Auto-merged PR #${pr.number}`);

                // Tag release to mark this version as synced
                await github.rest.git.createRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `refs/tags/v${version}-anjan`,
                  sha: pr.head.sha
                });
                console.log(`Tagged v${version}-anjan`);
              }
            }
