name: Sync Upstream

on:
  schedule:
    - cron: "0 0 * * 0" # Sunday 00:00 UTC
    - cron: "0 0 * * 3" # Wednesday 00:00 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FEATURE_COMMIT_COUNT: 6
      FEATURE_BRANCH: feature-commits
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/sst/opencode.git || true
          git fetch upstream --tags

      - name: Get upstream version
        id: upstream
        run: |
          VERSION=$(npm view opencode-ai version)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Upstream version: $VERSION"

      - name: Check if already synced
        id: check
        run: |
          VERSION="${{ steps.upstream.outputs.version }}"
          if git rev-parse "v${VERSION}-anjan" >/dev/null 2>&1; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Already synced to v${VERSION}-anjan"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Need to sync to v${VERSION}"
          fi

      - name: Sync with upstream
        if: steps.check.outputs.skip != 'true'
        id: sync
        run: |
          VERSION="${{ steps.upstream.outputs.version }}"
          BRANCH="sync/v${VERSION}"

          # Create sync branch from upstream tag
          git checkout "v${VERSION}"
          git checkout -b "$BRANCH"

          # Take the last N commits from feature-commits (oldest first)
          COMMITS=$(git log "origin/${FEATURE_BRANCH}" -"${FEATURE_COMMIT_COUNT}" --reverse --format="%H")

          echo "Picking last ${FEATURE_COMMIT_COUNT} commits from ${FEATURE_BRANCH}:"
          echo "$COMMITS"

          RESULTS=""
          FAILED="false"
          CONFLICT_COMMIT=""

          for COMMIT in $COMMITS; do
            MSG=$(git log -1 --format="%s" $COMMIT)
            SHORT=$(git rev-parse --short $COMMIT)

            # Skip commits that only touch fork-infrastructure files (handled by Preserve step)
            CHANGED=$(git diff-tree --no-commit-id --name-only -r $COMMIT)
            FORK_INFRA_ONLY="true"
            for F in $CHANGED; do
              case "$F" in
                .github/workflows/*|scripts/publish-fork.ts) ;;
                *) FORK_INFRA_ONLY="false" ;;
              esac
            done
            if [ "$FORK_INFRA_ONLY" = "true" ]; then
              RESULTS="${RESULTS}| ⏭️ | $SHORT | $MSG (fork-infra, skipped) |\n"
              echo "Skipped (fork-infra): $MSG"
              continue
            fi

            echo "Applying: $SHORT $MSG"

            if git cherry-pick "$COMMIT" --no-commit; then
              git commit -m "$MSG" --no-verify
              RESULTS="${RESULTS}| ✅ | $SHORT | $MSG |\n"
              echo "Success: $MSG"
            else
              git cherry-pick --abort 2>/dev/null || git reset --hard HEAD
              RESULTS="${RESULTS}| ❌ | $SHORT | $MSG |\n"
              FAILED="true"
              CONFLICT_COMMIT="$SHORT"
              echo "Failed: $MSG"
              break
            fi
          done

          echo "results<<EOF" >> $GITHUB_OUTPUT
          echo -e "$RESULTS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "conflict_commit=$CONFLICT_COMMIT" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Preserve fork workflows
        if: steps.check.outputs.skip != 'true'
        run: |
          # Remove all workflow files (these came from the upstream tag)
          git rm -rf .github/workflows/ 2>/dev/null || true
          # Restore fork-infrastructure files from release branch
          git checkout origin/release -- .github/workflows/ scripts/publish-fork.ts
          git add .github/workflows/ scripts/publish-fork.ts
          # Commit only if fork-infra files actually differ
          git diff --cached --quiet || git commit -m "preserve fork workflow files" --no-verify

      - name: Push sync branch
        if: steps.check.outputs.skip != 'true'
        run: |
          git push origin "${{ steps.sync.outputs.branch }}" --force

      - name: Backup feature branch
        if: steps.check.outputs.skip != 'true' && steps.sync.outputs.failed == 'true'
        run: |
          VERSION="${{ steps.upstream.outputs.version }}"
          BACKUP="${FEATURE_BRANCH}-backup-v${VERSION}"
          git push origin "origin/${FEATURE_BRANCH}:refs/heads/${BACKUP}" --no-verify
          echo "Created backup branch: ${BACKUP}"

      - name: Create PR
        if: steps.check.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          SYNC_VERSION: ${{ steps.upstream.outputs.version }}
          SYNC_BRANCH: ${{ steps.sync.outputs.branch }}
          SYNC_FAILED: ${{ steps.sync.outputs.failed }}
          SYNC_CONFLICT: ${{ steps.sync.outputs.conflict_commit }}
          SYNC_RESULTS: ${{ steps.sync.outputs.results }}
        with:
          script: |
            const version = process.env.SYNC_VERSION;
            const branch = process.env.SYNC_BRANCH;
            const failed = process.env.SYNC_FAILED === 'true';
            const conflictCommit = process.env.SYNC_CONFLICT;
            const results = process.env.SYNC_RESULTS;

            let body = `## Sync with upstream v${version}\n\n`;
            body += `### Cherry-pick Results\n\n`;
            body += `| Status | Commit | Message |\n`;
            body += `|--------|--------|--------|\n`;
            body += results;
            body += `\n`;

            const featureBranch = process.env.FEATURE_BRANCH;
            const commitCount = process.env.FEATURE_COMMIT_COUNT;

            if (failed) {
              body += `### ⚠️ Conflicts Detected\n\n`;
              body += `Cherry-pick failed at commit \`${conflictCommit}\`.\n\n`;
              body += `A backup of \`${featureBranch}\` was saved to \`${featureBranch}-backup-v${version}\`.\n\n`;
              body += `**Step 1: Fix the sync branch conflict**\n`;
              body += `\`\`\`bash\n`;
              body += `git fetch origin ${branch}\n`;
              body += `git checkout ${branch}\n`;
              body += `git cherry-pick --continue  # resolve conflicts manually\n`;
              body += `git push origin ${branch} --force\n`;
              body += `\`\`\`\n\n`;
              body += `**Step 2: Rebase ${featureBranch} onto the new upstream tag**\n`;
              body += `\`\`\`bash\n`;
              body += `git checkout ${featureBranch}\n`;
              body += `git rebase --onto v${version} HEAD~${commitCount}\n`;
              body += `git push origin ${featureBranch} --force\n`;
              body += `\`\`\`\n\n`;
              body += `After resolving, this PR will be ready to merge.\n`;
            } else {
              body += `### ✅ All commits applied successfully!\n\n`;
              body += `This PR is ready to merge.\n`;
            }

            // Check for existing PR
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: 'open'
            });

            if (prs.length > 0) {
              // Update existing PR
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prs[0].number,
                body: body
              });
              console.log(`Updated PR #${prs[0].number}`);
            } else {
              // Create new PR
              const { data: pr } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `sync: upstream v${version}`,
                head: branch,
                base: 'release',
                body: body
              });
              console.log(`Created PR #${pr.number}`);
              
              // Auto-merge if no conflicts
              if (!failed) {
                await github.rest.pulls.merge({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  merge_method: 'merge'
                });
                console.log(`Auto-merged PR #${pr.number}`);
              }
            }
